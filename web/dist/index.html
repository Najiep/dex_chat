<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dex Chat</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="chat" class="chat" aria-live="polite">
    <section id="messages" class="messages" aria-label="Chat messages"></section>

    <section id="composer" class="composer hidden" aria-label="Chat input">
      <div class="composer-top">
        <div id="channelTabs" class="channel-tabs" role="tablist" aria-label="Quick chat channels"></div>
        <button id="settingsButton" class="icon-button" type="button" aria-label="Open chat settings">⚙</button>
      </div>

      <div class="input-row">
        <span id="modeBadge" class="mode-badge">LOCAL</span>
        <input id="input" maxlength="250" autocomplete="off" spellcheck="false" placeholder="Type a message or /command" aria-label="Chat message" />
        <span id="characterCounter" class="character-counter">0/250</span>
      </div>

      <div id="suggestions" class="suggestions hidden" role="listbox" aria-label="Command suggestions"></div>
    </section>

    <section id="settings" class="settings hidden" aria-label="Chat settings">
      <div class="settings-header">
        <div>
          <h2>Chat Settings</h2>
          <p>Personal settings are saved on this client.</p>
        </div>
        <button id="settingsClose" class="icon-button" type="button" aria-label="Close settings">×</button>
      </div>

      <label class="setting-row">
        <span>Theme</span>
        <select id="themeSelect"></select>
      </label>

      <label class="setting-row range-row">
        <span>Scale <strong id="scaleValue">100%</strong></span>
        <input id="scaleRange" type="range" min="0.75" max="1.35" step="0.05" />
      </label>

      <label class="setting-row range-row">
        <span>Opacity <strong id="opacityValue">96%</strong></span>
        <input id="opacityRange" type="range" min="0.45" max="1" step="0.05" />
      </label>

      <label class="toggle-row"><input id="compactToggle" type="checkbox" /><span>Compact messages</span></label>
      <label class="toggle-row"><input id="timestampsToggle" type="checkbox" /><span>Show timestamps</span></label>
      <label class="toggle-row"><input id="blurToggle" type="checkbox" /><span>Background blur</span></label>
      <label class="toggle-row"><input id="motionToggle" type="checkbox" /><span>Reduce motion</span></label>

      <button id="saveSettings" class="primary-button" type="button">Save settings</button>
    </section>
  </main>
  <script src="./app.js"></script>
  <script src="./settings-bridge.js"></script>
</body>
</html>
